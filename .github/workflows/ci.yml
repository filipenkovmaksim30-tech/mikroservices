name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  auth:
    runs-on: ubuntu-latest
    env:
      AUTH_TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/auth_test
      POSTGRESQL_HOST: 127.0.0.1
      POSTGRESQL_USER: ci
      POSTGRESQL_PASSWORD: ci
      POSTGRESQL_DB: auth_test
      POSTGRESQL_PORT: 5432

      REDIS_URL: redis://127.0.0.1:6379/0

      JWT_PRIVATE_KEY_PATH: /tmp/orderflow-ci-jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /tmp/orderflow-ci-jwt-public.pem
      JWT_ALGORITHM: RS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 15
      JWT_ISSUER: auth-service
      JWT_AUDIENCE: orderflow-services

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "0.12.5"

      - name: Install Python
        run: uv python install 3.13
      
      - name: Install Dependencies
        run: uv sync --locked
        working-directory: auth-service

      - name: Generate test JWT keys
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$JWT_PRIVATE_KEY_PATH"
          openssl pkey -in "$JWT_PRIVATE_KEY_PATH" -pubout -out "$JWT_PUBLIC_KEY_PATH"

      - name: Run Pytest
        working-directory: auth-service
        run: uv run pytest



  
