x-order-service: &order-service
  image: messaging-lab-order-service:local
  build:
    context: ./order-service
  env_file:
    - ./order-service/.env
  environment:
    POSTGRESQL_HOST: order-postgres
    POSTGRESQL_PORT: 5432
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_ANALYTICS_TOPIC: ${KAFKA_ANALYTICS_TOPIC}
  restart: unless-stopped

x-analytics-service: &analytics-service
  image: analytics-service:local
  build:
    context: ./analytics-service
  env_file: ./analytics-service/.env
  environment:
    POSTGRESQL_HOST: analytics-postgres
    POSTGRESQL_PORT: 5432
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_ANALYTICS_TOPIC: ${KAFKA_ANALYTICS_TOPIC}
    KAFKA_ANALYTICS_DLQ_TOPIC: ${KAFKA_ANALYTICS_DLQ_TOPIC}
    KAFKA_CONSUMER_GROUP: ${KAFKA_ANALYTICS_CONSUMER_GROUP}
  restart: unless-stopped

services:
  order-migrations:
    <<: *order-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      order-postgres:
        condition: service_healthy
    restart: "no"

  analytics-migrations:
    <<: *analytics-service
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      analytics-postgres:
        condition: service_healthy
    restart: "no"


  order-api:
    <<: *order-service
    command: ["python", "-m", "uvicorn", "messaging_lab.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      order-migrations:
        condition: service_completed_successfully
  analytics-api:
    <<: *analytics-service
    command: ["python", "-m", "uvicorn", "analytics_service.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"
    depends_on:
      analytics-migrations:
        condition: service_completed_successfully

  order-publisher:
    <<: *order-service
    command: ["python", "-m", "messaging_lab.workers.rabbitmq_outbox_publisher"]
    depends_on:
      order-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy  
  notifications-consumer:
    <<: *order-service
    command: ["python", "-m", "messaging_lab.workers.notifications"]
    depends_on:
      order-migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
  analytics-consumer:
    <<: *analytics-service
    command: ["python", "-m", "analytics_service.workers.kafka_consumer"]
    depends_on:
      analytics-migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: service_rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}

    ports:
      - "${RABBITMQ_PORT}:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    
    restart: unless-stopped
  
  order-postgres:
    image: postgres:15-alpine
    container_name: order_postgres
    environment:
      POSTGRES_USER: ${ORDER_POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${ORDER_POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${ORDER_POSTGRESQL_DB}
    ports:
      - "${ORDER_POSTGRESQL_PORT}:5432"
    volumes:
      - orders_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_POSTGRESQL_USER} -d ${ORDER_POSTGRESQL_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  analytics-postgres:
    image: postgres:15-alpine
    container_name: analytics_postgres
    environment:
      POSTGRES_USER: ${ANALYTICS_POSTGRESQL_USER}
      POSTGRES_PASSWORD: ${ANALYTICS_POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${ANALYTICS_POSTGRESQL_DB}
    ports:
      - "${ANALYTICS_POSTGRESQL_PORT}:5432"
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_POSTGRESQL_USER} -d ${ANALYTICS_POSTGRESQL_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  kafka:
    image: apache/kafka:4.1.1
    container_name: service_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: "${KAFKA_NUM_PARTITIONS}"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_EXTERNAL_PORT}:29092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic "${KAFKA_ANALYTICS_TOPIC}" \
          --partitions "${KAFKA_ANALYTICS_PARTITIONS}" \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic "${KAFKA_ANALYTICS_DLQ_TOPIC}" \
          --partitions "${KAFKA_ANALYTICS_DLQ_PARTITIONS}" \
          --replication-factor 1
    restart: "no"
  kafka-publisher:
    <<: *order-service
    command: ["python", "-m", "messaging_lab.workers.kafka_outbox_publisher"]
    depends_on:
      order-migrations:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      

volumes:
  rabbitmq_data:
  orders_postgres_data:
  analytics_postgres_data:
  kafka_data:
    
