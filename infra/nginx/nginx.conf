events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    upstream api_gateway {
        zone api_gateway 64k;
        server api-gateway:8000 resolve;
        keepalive 32;
    }

    upstream media_filer {
        zone media_filer 64k;
        server weed-mini:8888 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 2m;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        location /api/ {
            proxy_pass http://api_gateway;
        }

        location ~ "^/api/admin/products/[0-9a-f-]{36}/images$" {
            client_max_body_size 6m;
            proxy_pass http://api_gateway;
        }

        location ~ "^/api/admin/products/[0-9a-f-]{36}/model-3d$" {
            client_max_body_size 27m;
            proxy_pass http://api_gateway;
        }


        location ~ "^/media/products/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(?:images/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(?:large|thumbnail)\.webp|models/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.glb)$" {
            limit_except GET {
                deny all;
            }

            rewrite ^/media/(.*)$ /buckets/product-media/$1 break;
            proxy_pass http://media_filer;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }


        location /media/ {
            return 404;
        }

        location ^~ /docs {
            proxy_pass http://api_gateway;
        }

        location = /openapi.json {
            proxy_pass http://api_gateway;
        }
    }
}
